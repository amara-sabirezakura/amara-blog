name: Shirone CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        continue-on-error: true
        run: pnpm exec biome ci ./src --reporter=github

  checks:
    name: Diagnostics and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout content repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: amara-sabirezakura/amara-blog-data
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      # `pnpm content:sync` 生成 `src/user/user-config.ts` 与 `src/content/`；
      # 双仓模式下这两者都不在代码仓里，缺了它们 `astro check` 会在导入阶段就挂。
      - name: Materialize content
        env:
          CONTENT_DIR: .content-src
        run: pnpm content:sync

      - name: Check Astro diagnostics
        run: pnpm exec astro check

      - name: Check Svelte diagnostics
        run: pnpm dlx svelte-check@4.7.6 --tsconfig ./tsconfig.json --threshold error

      - name: Validate atom manifest
        run: pnpm check:manifest

      # content-config 那组用例断言的是「代码仓自带 config/ 夹具、本地模式生成空覆盖层」
      # 的模型；双仓模式下 config/*.yaml 来自私有内容仓，这组在这里没有可测对象。
      - name: Run unit tests
        run: |
          node --test \
            "tests/*.test.mjs" \
            "tests/plugins/**/*.test.mjs" \
            "tests/utils/**/*.test.mjs" \
            "tests/content/content-clean.test.mjs" \
            "tests/content/content-cli.test.mjs" \
            "tests/content/content-eject.test.mjs" \
            "tests/content/content-export.test.mjs" \
            "tests/content/content-status.test.mjs" \
            "tests/content/content-sync.test.mjs"

  build:
    name: Build (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout content repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: amara-sabirezakura/amara-blog-data
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Build production site
        env:
          CONTENT_DIR: .content-src
        run: pnpm build

  # 上游的样式回归用例（fonts / inline-code-emphasis）打开的是 `/posts/expressive-code/`，
  # 而这个站点把全部演示文章加密进了「隐藏区」，页面只剩密码框，用例没有可测目标。
  # 先停用；将来有一篇未加密、带代码块的公开文章时，把两条 spec 指过去再删掉下面这行。
  styles:
    name: Style regressions
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          # Must match `packageManager` in package.json: pnpm/action-setup
          # rejects the run when both specify a version.
          version: 11.28.2
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Checkout content repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: amara-sabirezakura/amara-blog-data
          path: .content-src
          token: ${{ secrets.CONTENT_REPO_TOKEN }}
          persist-credentials: false

      - name: Materialize content
        env:
          CONTENT_DIR: .content-src
        run: pnpm content:sync

      # `webServer` 拉起的是 `astro dev`，它不会跑 sync，所以内容必须先物化。
      # 站点 base 取自内容仓的 config/site.yaml，避免在这里再手写一份。
      - name: Resolve site base
        id: base
        run: |
          node -e "const fs=require('node:fs');const m=/^base:\s*(\S+)/m.exec(fs.readFileSync('.content-src/config/site.yaml','utf8'));process.stdout.write('base='+(m?m[1].replace(/\/$/,''):''))" >> "$GITHUB_OUTPUT"

      - name: Run style regressions
        env:
          CONTENT_DIR: .content-src
          SITE_BASE: ${{ steps.base.outputs.base }}
        run: pnpm exec playwright test tests/site/fonts.spec.ts tests/site/inline-code-emphasis.spec.ts
